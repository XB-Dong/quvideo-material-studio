name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lint, typecheck and behavior tests in container
        run: docker compose -f compose.yaml -f compose.test.yaml run --build --rm --no-deps frontend-check
      - name: Production build in container
        run: docker compose build frontend

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Java tests, real MySQL integration and package in container
        run: docker compose -f compose.yaml -f compose.test.yaml run --build --rm backend-check
      - name: Preserve test database logs
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml logs --no-color mysql-test
      - name: Clean test services
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down --volumes

  integration:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start clean full stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Independent API acceptance through frontend proxy
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: docker compose -f compose.yaml -f compose.test.yaml run --build --rm api-check
      - name: Independent P1.1 browser and business acceptance
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: docker compose -f compose.yaml -f compose.test.yaml run --build --rm --no-deps browser-p11-check accept.mjs
      - name: Default software visible ink, borders and card effects
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: docker compose -f compose.yaml -f compose.test.yaml run --rm --no-deps -e OUTPUT_DIR=/evidence/visual browser-p11-check visual.mjs
      - name: Continuous interaction and resource measurements
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: docker compose -f compose.yaml -f compose.test.yaml run --rm --no-deps -e OUTPUT_DIR=/evidence/interaction browser-p11-check interact.mjs
      - name: Browser performance measurements
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: docker compose -f compose.yaml -f compose.test.yaml run --rm --no-deps -e OUTPUT_DIR=/evidence/measure browser-p11-check measure.mjs
      - name: Per-run budget guard behavior tests
        run: docker compose -f compose.yaml -f compose.test.yaml run --rm --no-deps browser-p11-check --test budgets.test.mjs
      - name: Browser-native background cleanup and recovery
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: docker compose -f compose.yaml -f compose.test.yaml run --build --rm --no-deps browser-p11-headed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            runtime/p11-browser/**/*.json
            runtime/p11-browser/**/*.png
          retention-days: 7
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-logs
          path: compose.log
          retention-days: 7
      - name: Clean isolated CI services
        if: always()
        run: docker compose down --volumes
