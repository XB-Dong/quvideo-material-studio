name: material-studio

services:
  mysql:
    image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-material_studio}
      MYSQL_USER: ${MYSQL_USER:-material_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-demo-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-change-me}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      JAVA_DB_URL: ${JAVA_DB_URL:-jdbc:mysql://mysql:3306/material_studio?connectionTimeZone=UTC}
      JAVA_DB_USERNAME: ${JAVA_DB_USERNAME:-material_app}
      JAVA_DB_PASSWORD: ${JAVA_DB_PASSWORD:-local-demo-change-me}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      STORAGE_ROOT: /data/materials
      TASK_QUEUE_CAPACITY: ${TASK_QUEUE_CAPACITY:-20}
      SIMULATION_CONTROLS_ENABLED: ${SIMULATION_CONTROLS_ENABLED:-true}
      SIMULATION_ASSET_CHECK_DELAY_MS: ${SIMULATION_ASSET_CHECK_DELAY_MS:-1000}
      SIMULATION_GENERATE_DELAY_MS: ${SIMULATION_GENERATE_DELAY_MS:-5000}
      SIMULATION_FINALIZE_DELAY_MS: ${SIMULATION_FINALIZE_DELAY_MS:-1000}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
      TZ: UTC
    volumes:
      - material-files:/data/materials
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runner
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/categories').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:
  material-files:
