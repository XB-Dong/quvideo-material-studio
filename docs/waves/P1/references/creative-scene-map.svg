<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160"><defs><linearGradient id="a"><stop stop-color="#7961C5" /><stop offset="1" stop-color="#4F63D8" /></linearGradient></defs><rect width="1440" height="1160" fill="#F7F8FC" /><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#202433"><text x="56" y="65" font-size="30" font-weight="bold">映作 · 七种创意，一个清晰的创作流程</text><text x="56" y="102" fill="#626B7C" font-size="17">P1-1.2 开发编排图 / 技术标注仅供文档，前端不展示特效说明；尚未实现</text>
<rect x="56" y="140" width="1328" height="270" rx="24" fill="#FFFFFF" stroke="#E2E5ED" /><text x="88" y="184" font-size="22">01  创作引导 · 浅色留白 + 局部蓝紫细节</text><text x="88" y="233" font-size="32">让灵感，轻轻动起来。</text><text x="88" y="271" fill="#626B7C" font-size="17">Glow Cursor 局部留白 / 原生光标保留 / 空闲衰减停运</text><rect x="88" y="305" width="245" height="56" rx="12" fill="#4F63D8" /><text x="118" y="341" font-size="18" fill="#FFFFFF">开始创作</text><text x="88" y="391" fill="#626B7C" font-size="15">Electric短触发时先释放Glow的WebGL，再接管；结束后恢复</text>
<ellipse cx="1080" cy="276" rx="205" ry="86" fill="none" stroke="#7961C5" stroke-dasharray="6 7" /><rect x="871" y="211" width="110" height="130" rx="16" fill="#F0F2F7" stroke="#C8C2E8" /><rect x="1025" y="174" width="110" height="130" rx="16" fill="#FFFFFF" stroke="#C8C2E8" /><rect x="1180" y="240" width="110" height="130" rx="16" fill="#FFFFFF" stroke="#C8C2E8" /><text x="954" y="388" font-size="16">Orbit Images · ≥30s / 可暂停</text>
<rect x="56" y="434" width="1328" height="172" rx="24" fill="#FFFFFF" stroke="#E2E5ED" /><text x="88" y="477" font-size="22">02  模板与创作 · 内容稳定，操作优先</text><text x="88" y="516" fill="#626B7C" font-size="18">分类 / 模板卡 / 上传 / 多任务 / 历史 / 真实结果：克制的操作与状态过渡</text><text x="88" y="554" fill="#626B7C" font-size="18">真实图片不扭曲；错误即时可读；提交、请求取消、身份与轮询行为保留</text>
<rect x="56" y="630" width="1328" height="275" rx="24" fill="#FFFFFF" stroke="#E2E5ED" /><text x="88" y="674" font-size="22">03  灵感画廊 · 四页签，只运行当前一个</text><g font-size="18"><rect x="88" y="703" width="290" height="106" rx="16" fill="#F3F2FC" /><text x="112" y="744">创意作品</text><rect x="396" y="703" width="290" height="106" rx="16" fill="#F0F2F7" /><text x="420" y="744">旅行作品</text><rect x="704" y="703" width="290" height="106" rx="16" fill="#F0F2F7" /><text x="728" y="744">人像作品</text><rect x="1012" y="703" width="340" height="106" rx="16" fill="#F0F2F7" /><text x="1036" y="744">宠物作品</text></g><text x="88" y="858" fill="#626B7C" font-size="18">互动时暂停Orbit并释放Glow；切页签先释放旧context再挂载下一个；不拦截触屏滚动</text>
<rect x="56" y="930" width="648" height="140" rx="20" fill="#F0F2F7" /><text x="88" y="970" font-size="22">创意 / 美学门槛 · Reviewer</text><text x="88" y="1008" fill="#626B7C" font-size="17">七项实际演示；构图、贴合、色彩、节奏、克制各≥4/5</text><text x="88" y="1043" fill="#626B7C" font-size="17">不能全部关闭特效后宣称创意通过</text><rect x="728" y="930" width="656" height="140" rx="20" fill="#F0F2F7" /><text x="760" y="970" font-size="22">使用舒适门槛 · Acceptance</text><text x="760" y="1008" fill="#626B7C" font-size="17">阅读、操作、焦点、静态、性能、P0回归全部通过</text><text x="760" y="1043" fill="#626B7C" font-size="17">同视口≤2活跃系统 / ≤1存活WebGL / 一键静态</text><text x="56" y="1120" fill="#626B7C" font-size="16">2026-10-29 · P1启动前准备 · 两份独立签署 + Leader处置复验后才完成</text></g></svg>