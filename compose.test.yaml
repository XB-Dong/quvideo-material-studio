services:
  frontend-check:
    profiles: [test]
    build:
      context: ./frontend
      target: test
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

  mysql-test:
    profiles: [test]
    image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    environment:
      MYSQL_DATABASE: material_test
      MYSQL_USER: material_test
      MYSQL_PASSWORD: test-only-password
      MYSQL_ROOT_PASSWORD: test-only-root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend-check:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      JAVA_DB_URL: jdbc:mysql://mysql-test:3306/material_test?connectionTimeZone=UTC
      JAVA_DB_USERNAME: material_test
      JAVA_DB_PASSWORD: test-only-password
      APP_PUBLIC_ORIGIN: http://localhost:3000
      STORAGE_ROOT: /tmp/material-test
      SIMULATION_CONTROLS_ENABLED: "true"
    depends_on:
      mysql-test:
        condition: service_healthy

  api-check:
    profiles: [test]
    build:
      context: ./tests
    environment:
      BASE_URL: http://frontend:3000
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:3000}
      TESTED_COMMIT: ${TESTED_COMMIT:-working-tree}
    depends_on:
      frontend:
        condition: service_healthy

  browser-check:
    profiles: [test]
    build:
      context: ./tests/p1
    environment:
      BASE_URL: http://localhost:3000
      RELAY_HOST: frontend
      OUTPUT_DIR: /evidence
      TESTED_COMMIT: ${TESTED_COMMIT:-working-tree}
      FORCE_GPU_FUNCTIONAL: ${FORCE_GPU_FUNCTIONAL:-0}
      WAIT_PREFLIGHT: "1"
    volumes:
      - ${P1_EVIDENCE_DIR:-./runtime/p1-browser}:/evidence
    depends_on:
      frontend:
        condition: service_healthy

  browser-p11-check:
    profiles: [test]
    build:
      context: ./tests
      dockerfile: p1.1/Dockerfile
    environment:
      BASE_URL: http://localhost:3000
      RELAY_HOST: frontend
      OUTPUT_DIR: /evidence
      TESTED_COMMIT: ${TESTED_COMMIT:-working-tree}
    volumes:
      - ${P11_EVIDENCE_DIR:-./runtime/p11-browser}:/evidence
    depends_on:
      frontend:
        condition: service_healthy

  browser-p11-headed:
    profiles: [test]
    build:
      context: ./tests
      dockerfile: p1.1/Dockerfile.headed
    environment:
      RELAY_HOST: frontend
      OUTPUT_DIR: /evidence/native
      TESTED_COMMIT: ${TESTED_COMMIT:-working-tree}
    volumes:
      - ${P11_EVIDENCE_DIR:-./runtime/p11-browser}:/evidence
    depends_on:
      frontend:
        condition: service_healthy

  browser-p12-check:
    profiles: [test]
    build:
      context: ./tests
      dockerfile: p1.2/Dockerfile
    environment:
      BASE_URL: http://localhost:3000
      RELAY_HOST: frontend
      OUTPUT_DIR: /evidence
      TESTED_COMMIT: ${TESTED_COMMIT:-working-tree}
    volumes:
      - ${P12_EVIDENCE_DIR:-./runtime/p12-browser}:/evidence
    depends_on:
      frontend:
        condition: service_healthy

  browser-p12-headed:
    profiles: [test]
    build:
      context: ./tests
      dockerfile: p1.2/Dockerfile.headed
    environment:
      RELAY_HOST: frontend
      OUTPUT_DIR: /evidence/native
      TESTED_COMMIT: ${TESTED_COMMIT:-working-tree}
    volumes:
      - ${P12_EVIDENCE_DIR:-./runtime/p12-browser}:/evidence
    depends_on:
      frontend:
        condition: service_healthy

  browser-p2-check:
    profiles: [test]
    build:
      context: ./tests
      dockerfile: p2/Dockerfile
    environment:
      BASE_URL: ${P2_BASE_URL:-http://localhost:3000}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:3000}
      RELAY_HOST: frontend
      RELAY_PORT: "3000"
      OUTPUT_DIR: /evidence
      TESTED_COMMIT: ${TESTED_COMMIT:-working-tree}
    volumes:
      - ${P2_EVIDENCE_DIR:-./runtime/p2-browser}:/evidence
    depends_on:
      frontend:
        condition: service_healthy

  browser-p2-media:
    profiles: [test]
    image: material-studio-p2-media
    build:
      context: ./tests
      dockerfile: p2/Dockerfile.media
    environment:
      BASE_URL: ${P2_BASE_URL:-http://localhost:3000}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:3000}
      RELAY_HOST: frontend
      RELAY_PORT: "3000"
      OUTPUT_DIR: /evidence
      TESTED_COMMIT: ${TESTED_COMMIT:-working-tree}
    volumes:
      - ${P2_EVIDENCE_DIR:-./runtime/p2-browser}:/evidence
    depends_on:
      frontend:
        condition: service_healthy
